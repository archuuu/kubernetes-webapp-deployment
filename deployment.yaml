apiVersion: apps/v1
kind: Deployment

metadata:
  name: myproject-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: myproject

  template:
    metadata:
      labels:
        app: myproject

    spec:
      containers:
      - name: myproject

        image: archana2309/myproject:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "200m"